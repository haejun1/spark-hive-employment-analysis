# 개발 환경 설정
development:
  # 데이터베이스 접속 정보
  mysql:
    host: "ENV_DB_HOST"
    port: "ENV_DB_PORT"
    user: "ENV_DB_USER"
    password: "ENV_DB_PASSWORD"
    database: "ENV_DB_DATABASE"
    table_name: "jumpit_jobs"

  # 점핏 API
  jumpit:
    base_url: "https://jumpit-api.saramin.co.kr/api"
    endpoint: "/positions"

  # kafka 설정
  kafka:
    bootstrap_servers: "localhost:9092"
    topic: "jumpit-realtime-jobs" 
    group_id: "jumpit-streaming-group"

  # spark 설정
  spark:
    master: "local[*]"
    shuffle_partitions: "2"
    parquet_path: "hdfs://localhost:9000/user/data/processed/jumpit_processed"
    checkpoint_path: "hdfs://localhost:9000/user/data/checkpoint/jumpit_stream"